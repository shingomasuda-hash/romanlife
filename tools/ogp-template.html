<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #265036;
        color: #fff;
        font-family: 'Zen Kaku Gothic New', sans-serif;
        position: relative;
      }

      .glow-a, .glow-b { position: absolute; border-radius: 50%; }
      .glow-a {
        width: 760px; height: 760px; top: -320px; left: -180px;
        background: radial-gradient(circle, rgba(127,156,120,.42), rgba(127,156,120,0) 70%);
      }
      .glow-b {
        width: 620px; height: 620px; bottom: -260px; right: -120px;
        background: radial-gradient(circle, rgba(199,169,105,.28), rgba(199,169,105,0) 70%);
      }

      .frame {
        position: absolute; inset: 26px;
        border: 1px solid rgba(236,223,194,.4);
      }

      .inner {
        position: relative; height: 100%;
        padding: 66px 78px 60px;
        display: flex; flex-direction: column; justify-content: space-between;
      }

      .eyebrow {
        display: flex; align-items: center; gap: 16px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 25px; letter-spacing: .3em; text-transform: uppercase;
        color: #c7a969;
      }
      .eyebrow::before { content: ''; width: 56px; height: 1px; background: #c7a969; }

      .badge {
        display: inline-block; margin-top: 22px; padding: 9px 22px;
        border-radius: 999px; background: #ecdfc2; color: #16301f;
        font-size: 23px; font-weight: 700; letter-spacing: .04em;
      }

      h1 {
        margin-top: 30px;
        font-family: 'Shippori Mincho', serif;
        font-weight: 600; font-size: 64px; line-height: 1.42;
        letter-spacing: .01em; color: #fff;
      }

      .sub {
        margin-top: 18px; margin-bottom: 8px; font-size: 26px; line-height: 1.7;
        color: rgba(255,255,255,.86); font-weight: 500;
      }

      .foot {
        display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
      }

      .dates { display: flex; gap: 20px; }

      .date {
        padding: 16px 26px 14px;
        border: 1px solid rgba(236,223,194,.45);
        border-radius: 12px;
        background: rgba(255,255,255,.07);
        text-align: center;
      }
      .date .num {
        font-family: 'Cormorant Garamond', serif;
        font-size: 46px; font-weight: 500; line-height: 1; color: #fff;
      }
      .date .num span { font-size: 22px; letter-spacing: .14em; color: #c7a969; }
      .date .ja { margin-top: 8px; font-size: 20px; font-weight: 700; color: #fff; }

      .org { text-align: right; }
      .org .en {
        font-family: 'Cormorant Garamond', serif;
        font-size: 24px; letter-spacing: .26em; color: #c7a969; text-transform: uppercase;
      }
      .org .ja {
        margin-top: 6px; font-family: 'Shippori Mincho', serif;
        font-size: 30px; font-weight: 600; color: #fff;
      }
      .org .brand { margin-top: 8px; font-size: 20px; color: rgba(255,255,255,.78); }
    </style>
  </head>
  <body>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="frame"></div>

    <div class="inner">
      <div>
        <p class="eyebrow">Open Company 2026</p>
        <p class="badge">2028年卒向け 採用イベント</p>
        <h1>お菓子の先にある、<br />しあわせを届ける仕事。</h1>
        <p class="sub">京都から、心を動かす仕事を知る3時間。</p>
      </div>

      <div class="foot">
        <div class="dates">
          <div class="date">
            <p class="num">08.11 <span>TUE</span></p>
            <p class="ja">8月11日（火）</p>
          </div>
          <div class="date">
            <p class="num">08.31 <span>MON</span></p>
            <p class="ja">8月31日（月）</p>
          </div>
        </div>
        <div class="org">
          <p class="en">Romanlife</p>
          <p class="ja">株式会社ロマンライフ</p>
          <p class="brand">京都北山 マールブランシュ</p>
        </div>
      </div>
    </div>
  </body>
</html>
